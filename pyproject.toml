[project]
name = "mcp-ph-sms"
dynamic = ["version"]
description = "A Model Context Protocol (MCP) server for sending SMS via free Philippines APIs and managing local contacts."

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.14",
]

[project.scripts]
mcp-ph-sms = "src.main:main"